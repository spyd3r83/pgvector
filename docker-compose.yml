services:
  pg-vector-postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: sha256:d8e8fe0b3789dde0035966b80796afdfa10a8e98d3a338b0920b88472cbd1ba1
    container_name: pg-vector-postgres
    pull_policy: never
    hostname: pg-vector-postgres-default
    stop_grace_period: 90s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgvector_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF-8 --lc-collate=C --lc-ctype=C}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgvector_user} -d ${POSTGRES_DB:-pgvector_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - pg-vector-postgres-data:/var/lib/postgresql/data
    networks:
      jelly_wg0:
        ipv4_address: 10.66.87.4
        aliases:
          - pg-vector-postgres-default
networks:
  jelly_wg0:
    external: true
volumes:
  pg-vector-postgres-data:
    external: true
    name: postgres-vector_pg-vector-postgres-data
