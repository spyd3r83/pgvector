services:
  pg-vector-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-vector-postgres
    pull_policy: build
    hostname: pg-vector-postgres-${RANDOM:-$(date +%s)}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgvector_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF-8 --lc-collate=C --lc-ctype=C}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgvector_user} -d ${POSTGRES_DB:-pgvector_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - pg-vector-postgres-data:/var/lib/postgresql/data
    networks:
      - jelly_wg0
networks:
  jelly_wg0:
    external: true
volumes:
    pg-vector-postgres-data: